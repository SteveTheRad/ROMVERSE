name: test

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pip install -e ".[dev]"
      - run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - run: ruff check .
      - run: ruff format --check .

  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./companion/gradlew --no-daemon -p companion testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: romverse-companion-debug
          path: companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  desktop-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python scripts/verify_wheel.py dist/romverse-0.1.0-py3-none-any.whl
      - run: python -m pip install dist/romverse-0.1.0-py3-none-any.whl
      - run: python scripts/smoke_installed_desktop.py "${{ runner.temp }}/romverse-smoke"
        env:
          QT_QPA_PLATFORM: offscreen
