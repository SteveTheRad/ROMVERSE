name: test

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0
      - run: python -m pip install -e ".[dev]"
      - run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - run: ruff check .
      - run: ruff format --check .

  windows-portability:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pytest
          tests/test_app_launch_settings.py
          tests/test_parsers.py
          tests/test_workspace.py
          tests/test_local_store.py
          tests/test_vocabulary.py
          tests/test_release_scripts.py
          tests/test_desktop_release.py
          tests/test_desktop_updates.py
          tests/test_desktop_bundle.py
          tests/test_release_assets.py
          tests/test_device_requirements.py
          tests/test_device_packs.py
          tests/test_device_pack_validation.py
          tests/test_archive_catalog.py
          tests/test_firmware_upgrade.py
          tests/test_legal_terms.py
          tests/test_legal_privacy.py
          tests/test_preflight.py
          tests/test_build_readiness.py
          tests/test_activity_center.py
          tests/test_galaxy_store.py
          tests/test_galaxy_ui.py
          tests/test_companion_pairing.py
          tests/test_companion_transport.py
          tests/test_guardian_execution_plan.py
          tests/test_guardian_execution_gateway_contract.py
          tests/test_guardian_execution_result_receipt.py
          tests/test_guardian_live_target_receipt.py
          tests/test_guardian_final_consent.py
          tests/test_guardian_runtime_session.py
          tests/test_guardian_runtime_authorization.py
          tests/test_guardian_runtime_execution_claim.py
          tests/test_guardian_runtime_package.py
          tests/test_optimizer.py
          tests/test_navigation_vocabulary.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: ruff check .
      - run: ruff format --check .

  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - run: gradle --no-daemon -p companion testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: romverse-companion-debug
          path: companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  desktop-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            executable: ROMVERSE
          - os: windows-latest
            platform: windows-x86_64
            executable: ROMVERSE.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0
      - run: python -m pip install build "pyinstaller>=6.22,<7"
      - run: python -m build --wheel
      - run: python scripts/verify_wheel.py dist/romverse-0.1.0-py3-none-any.whl
      - run: python -m pip install dist/romverse-0.1.0-py3-none-any.whl
      - run: python scripts/smoke_installed_desktop.py "${{ runner.temp }}/romverse-smoke"
        env:
          QT_QPA_PLATFORM: offscreen
      - run: >-
          python scripts/build_desktop_executable.py
          --output-directory build/frozen
          --work-directory build/pyinstaller
      - run: >-
          python scripts/smoke_frozen_desktop.py
          build/frozen/ROMVERSE/${{ matrix.executable }}
          "${{ runner.temp }}/romverse-frozen-smoke"
        env:
          QT_QPA_PLATFORM: offscreen
      - run: >-
          python scripts/package_desktop_bundle.py
          build/frozen/ROMVERSE
          --platform ${{ matrix.platform }}
          --output dist/ROMVERSE-Desktop-0.1.0-${{ matrix.platform }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: romverse-desktop-bundle-${{ matrix.platform }}
          path: dist/ROMVERSE-Desktop-0.1.0-${{ matrix.platform }}.zip
          if-no-files-found: error

  desktop-release-candidate:
    needs: desktop-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install .
      - uses: actions/download-artifact@v8
        with:
          pattern: romverse-desktop-bundle-*
          path: dist
          merge-multiple: true
      - run: >-
          python scripts/prepare_desktop_release.py
          --version 0.1.0
          --release-id "romverse-desktop-0.1.0-${{ github.sha }}"
          --artifact "linux-portable:linux-x86_64:archive:dist/ROMVERSE-Desktop-0.1.0-linux-x86_64.zip"
          --artifact "windows-portable:windows-x86_64:archive:dist/ROMVERSE-Desktop-0.1.0-windows-x86_64.zip"
          --output dist/romverse-desktop-0.1.0-unsigned.json
      - run: >-
          python scripts/verify_unsigned_desktop_release.py
          dist/romverse-desktop-0.1.0-unsigned.json
          --artifact-directory dist
      - uses: actions/upload-artifact@v7
        with:
          name: romverse-desktop-release-candidate
          path: |
            dist/ROMVERSE-Desktop-0.1.0-linux-x86_64.zip
            dist/ROMVERSE-Desktop-0.1.0-windows-x86_64.zip
            dist/romverse-desktop-0.1.0-unsigned.json
          if-no-files-found: error
