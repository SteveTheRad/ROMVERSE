name: test

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libpulse0
      - run: python -m pip install -e ".[dev]"
      - run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - run: ruff check .
      - run: ruff format --check .

  windows-portability:
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pytest
          tests/test_app_launch_settings.py
          tests/test_parsers.py
          tests/test_workspace.py
          tests/test_vocabulary.py
          tests/test_release_scripts.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: ruff check .
      - run: ruff format --check .

  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - run: ./companion/gradlew --no-daemon -p companion testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: romverse-companion-debug
          path: companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  desktop-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libpulse0
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python scripts/verify_wheel.py dist/romverse-0.1.0-py3-none-any.whl
      - run: python -m pip install dist/romverse-0.1.0-py3-none-any.whl
      - run: python scripts/smoke_installed_desktop.py "${{ runner.temp }}/romverse-smoke"
        env:
          QT_QPA_PLATFORM: offscreen
