name: test

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/sync/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/sync/**"
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0
      - run: python -m pip install -e ".[dev]"
      - run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - run: ruff check .
      - run: ruff format --check .

  windows-portability:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pytest
          tests/test_app_launch_settings.py
          tests/test_parsers.py
          tests/test_workspace.py
          tests/test_local_store.py
          tests/test_vocabulary.py
          tests/test_release_scripts.py
          tests/test_desktop_release.py
          tests/test_desktop_updates.py
          tests/test_desktop_bundle.py
          tests/test_release_assets.py
          tests/test_device_requirements.py
          tests/test_device_packs.py
          tests/test_device_pack_validation.py
          tests/test_archive_catalog.py
          tests/test_firmware_upgrade.py
          tests/test_legal_terms.py
          tests/test_legal_privacy.py
          tests/test_preflight.py
          tests/test_build_readiness.py
          tests/test_activity_center.py
          tests/test_galaxy_store.py
          tests/test_galaxy_ui.py
          tests/test_companion_pairing.py
          tests/test_companion_transport.py
          tests/test_guardian_execution_plan.py
          tests/test_guardian_execution_gateway_contract.py
          tests/test_guardian_execution_result_receipt.py
          tests/test_guardian_live_target_receipt.py
          tests/test_guardian_final_consent.py
          tests/test_guardian_runtime_session.py
          tests/test_guardian_runtime_authorization.py
          tests/test_guardian_runtime_execution_claim.py
          tests/test_guardian_runtime_package.py
          tests/test_source_installation.py
          tests/test_guardian_source_installation.py
          tests/test_source_installation_history.py
          tests/test_source_installation_integration.py
          tests/test_source_installation_history_ui.py
          tests/test_source_installation_stop_ui.py
          tests/test_base_image_compatibility.py
          tests/test_candidate_avb.py
          tests/test_candidate_installation.py
          tests/test_guardian_candidate_installation.py
          tests/test_candidate_installation_history.py
          tests/test_candidate_installation_integration.py
          tests/test_candidate_installation_ui.py
          tests/test_candidate_installation_desktop.py
          tests/test_optimizer.py
          tests/test_navigation_vocabulary.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: ruff check .
      - run: ruff format --check .

  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - run: gradle --no-daemon -p companion testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: romverse-companion-debug
          path: companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  desktop-package:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            executable: ROMVERSE
          - os: windows-latest
            platform: windows-x86_64
            executable: ROMVERSE.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0
      - run: python -m pip install build "pyinstaller>=6.22,<7"
      - name: Read package version
        id: package_version
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          metadata = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={metadata['project']['version']}\n")
      - run: python -m build --wheel
      - run: >-
          python scripts/verify_wheel.py
          dist/romverse-${{ steps.package_version.outputs.version }}-py3-none-any.whl
      - run: >-
          python -m pip install
          dist/romverse-${{ steps.package_version.outputs.version }}-py3-none-any.whl
      - run: python scripts/smoke_installed_desktop.py "${{ runner.temp }}/romverse-smoke"
        env:
          QT_QPA_PLATFORM: offscreen
      - run: >-
          python scripts/build_desktop_executable.py
          --output-directory build/frozen
          --work-directory build/pyinstaller
      - run: >-
          python scripts/smoke_frozen_desktop.py
          build/frozen/ROMVERSE/${{ matrix.executable }}
          "${{ runner.temp }}/romverse-frozen-smoke"
        env:
          QT_QPA_PLATFORM: offscreen
      - run: >-
          python scripts/package_desktop_bundle.py
          build/frozen/ROMVERSE
          --platform ${{ matrix.platform }}
          --output dist/ROMVERSE-Desktop-${{ steps.package_version.outputs.version }}-${{ matrix.platform }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: romverse-desktop-bundle-${{ matrix.platform }}
          path: dist/ROMVERSE-Desktop-${{ steps.package_version.outputs.version }}-${{ matrix.platform }}.zip
          if-no-files-found: error

  desktop-release-candidate:
    if: github.event_name != 'pull_request'
    needs: desktop-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install .
      - name: Read package version
        id: package_version
        shell: python
        run: |
          import os
          from importlib.metadata import version

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version('romverse')}\n")
      - uses: actions/download-artifact@v8
        with:
          pattern: romverse-desktop-bundle-*
          path: dist
          merge-multiple: true
      - run: >-
          python scripts/prepare_desktop_release.py
          --version ${{ steps.package_version.outputs.version }}
          --release-id "romverse-desktop-${{ steps.package_version.outputs.version }}-${{ github.sha }}"
          --artifact "linux-portable:linux-x86_64:archive:dist/ROMVERSE-Desktop-${{ steps.package_version.outputs.version }}-linux-x86_64.zip"
          --artifact "windows-portable:windows-x86_64:archive:dist/ROMVERSE-Desktop-${{ steps.package_version.outputs.version }}-windows-x86_64.zip"
          --output dist/romverse-desktop-${{ steps.package_version.outputs.version }}-unsigned.json
      - run: >-
          python scripts/verify_unsigned_desktop_release.py
          dist/romverse-desktop-${{ steps.package_version.outputs.version }}-unsigned.json
          --artifact-directory dist
      - uses: actions/upload-artifact@v7
        with:
          name: romverse-desktop-release-candidate
          path: |
            dist/ROMVERSE-Desktop-${{ steps.package_version.outputs.version }}-linux-x86_64.zip
            dist/ROMVERSE-Desktop-${{ steps.package_version.outputs.version }}-windows-x86_64.zip
            dist/romverse-desktop-${{ steps.package_version.outputs.version }}-unsigned.json
          if-no-files-found: error
