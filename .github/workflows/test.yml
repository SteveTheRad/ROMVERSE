name: test

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .

  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle --no-daemon -p companion testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: romverse-companion-debug
          path: companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  desktop-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python scripts/verify_wheel.py dist/romverse-0.1.0-py3-none-any.whl
      - run: python -m pip install dist/romverse-0.1.0-py3-none-any.whl
      - run: python scripts/smoke_installed_desktop.py "${{ runner.temp }}/romverse-smoke"
        env:
          QT_QPA_PLATFORM: offscreen
      - run: >-
          python scripts/prepare_desktop_release.py
          --version 0.1.0
          --release-id "romverse-desktop-0.1.0-${{ github.sha }}"
          --artifact "current-python-wheel:python-any:wheel:dist/romverse-0.1.0-py3-none-any.whl"
          --output dist/romverse-desktop-0.1.0-unsigned.json
      - run: >-
          python scripts/verify_unsigned_desktop_release.py
          dist/romverse-desktop-0.1.0-unsigned.json
          --artifact-directory dist
      - uses: actions/upload-artifact@v4
        with:
          name: romverse-desktop-candidate-${{ matrix.os }}
          path: |
            dist/romverse-0.1.0-py3-none-any.whl
            dist/romverse-desktop-0.1.0-unsigned.json
          if-no-files-found: error
