[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "romverse"
version = "0.2.0a1"
description = "Connected Android diagnostics, repair, optimization, and intelligent ROM development studio"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "GPL-3.0-only" }
authors = [{ name = "SteveTheRad / RadForge Labs" }]
dependencies = [
  "cryptography>=46,<47",
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
release = [
  "build>=1.4,<2",
  "hatchling>=1.26,<2",
  "pyinstaller>=6.22,<7",
]

[project.scripts]
romverse = "romverse.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/romverse"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"] # Ruff's formatter deliberately leaves long strings and QSS declarations intact.
